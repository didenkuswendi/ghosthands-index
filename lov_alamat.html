<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOV Alamat Indonesia</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #f5f7fb;
    }

    .app-card {
        max-width: 850px;
        margin: 50px auto;
        border: 0;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .form-label {
        font-weight: 600;
    }

    .select-wrapper {
        position: relative;
    }

    .loading {
        position: absolute;
        right: 12px;
        top: 38px;
        display: none;
    }

    .result {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 18px;
    }

    .code-badge {
        font-size: 12px;
        font-weight: 500;
    }
</style>
</head>

<body>

<div class="container">
    <div class="card app-card">
        <div class="card-body p-4 p-md-5">

            <h3 class="mb-1">LOV Alamat Indonesia</h3>
            <p class="text-muted mb-4">
                Pilih wilayah secara bertingkat dari Provinsi hingga Kelurahan/Desa.
            </p>

            <!-- Provinsi -->
            <div class="mb-3 select-wrapper">
                <label class="form-label">Provinsi</label>
                <select id="provinsi" class="form-select">
                    <option value="">Memuat provinsi...</option>
                </select>
                <div id="loadingProvinsi" class="spinner-border spinner-border-sm loading"></div>
            </div>

            <!-- Kabupaten -->
            <div class="mb-3 select-wrapper">
                <label class="form-label">Kabupaten / Kota</label>
                <select id="kabupaten" class="form-select" disabled>
                    <option value="">-- Pilih Provinsi terlebih dahulu --</option>
                </select>
                <div id="loadingKabupaten" class="spinner-border spinner-border-sm loading"></div>
            </div>

            <!-- Kecamatan -->
            <div class="mb-3 select-wrapper">
                <label class="form-label">Kecamatan</label>
                <select id="kecamatan" class="form-select" disabled>
                    <option value="">-- Pilih Kabupaten / Kota terlebih dahulu --</option>
                </select>
                <div id="loadingKecamatan" class="spinner-border spinner-border-sm loading"></div>
            </div>

            <!-- Kelurahan -->
            <div class="mb-4 select-wrapper">
                <label class="form-label">Kelurahan / Desa</label>
                <select id="kelurahan" class="form-select" disabled>
                    <option value="">-- Pilih Kecamatan terlebih dahulu --</option>
                </select>
                <div id="loadingKelurahan" class="spinner-border spinner-border-sm loading"></div>
            </div>

            <div class="result">
                <div class="fw-semibold mb-2">Alamat Terpilih</div>

                <div id="alamatText" class="text-muted">
                    Belum ada pilihan.
                </div>

                <div id="kodeText" class="mt-2"></div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
const API = "https://api.kodewilayah.web.id";

/*
|--------------------------------------------------------------------------
| Cache
|--------------------------------------------------------------------------
| Data yang sudah pernah diambil disimpan di browser agar tidak
| melakukan request yang sama berulang kali.
*/
const cache = {
    provinces: null,
    regencies: {},
    districts: {},
    villages: {}
};


/*
|--------------------------------------------------------------------------
| Helper
|--------------------------------------------------------------------------
*/

function setLoading(id, state) {
    $(id).toggle(state);
}


function resetSelect(selector, text) {
    $(selector)
        .html(`<option value="">${text}</option>`)
        .prop("disabled", true);
}


function escapeHtml(text) {
    return $("<div>").text(text ?? "").html();
}


/*
|--------------------------------------------------------------------------
| API
|--------------------------------------------------------------------------
*/

async function getJSON(url) {

    const response = await fetch(url);

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    const json = await response.json();

    if (!json.success) {
        throw new Error(json.message || "API gagal");
    }

    return json.data;
}


/*
|--------------------------------------------------------------------------
| LOAD PROVINSI
|--------------------------------------------------------------------------
*/

async function loadProvinsi() {

    setLoading("#loadingProvinsi", true);

    try {

        let data;

        if (cache.provinces) {
            data = cache.provinces;
        } else {

            data = await getJSON(
                `${API}/provinces`
            );

            cache.provinces = data;
        }

        $("#provinsi").html(
            `<option value="">-- Pilih Provinsi --</option>`
        );

        data.forEach(item => {

            $("#provinsi").append(`
                <option value="${item.code}"
                        data-name="${escapeHtml(item.name)}">
                    ${escapeHtml(item.name)}
                </option>
            `);

        });

    } catch (error) {

        console.error(error);

        $("#provinsi").html(
            `<option value="">Gagal memuat provinsi</option>`
        );

        alert("Gagal mengambil data provinsi dari API.");

    } finally {

        setLoading("#loadingProvinsi", false);
    }
}


/*
|--------------------------------------------------------------------------
| PROVINSI -> KABUPATEN
|--------------------------------------------------------------------------
*/

$("#provinsi").on("change", async function() {

    const provinceCode = $(this).val();

    resetSelect(
        "#kabupaten",
        "-- Pilih Kabupaten / Kota --"
    );

    resetSelect(
        "#kecamatan",
        "-- Pilih Kabupaten / Kota terlebih dahulu --"
    );

    resetSelect(
        "#kelurahan",
        "-- Pilih Kecamatan terlebih dahulu --"
    );

    updateResult();

    if (!provinceCode) {
        return;
    }

    setLoading("#loadingKabupaten", true);

    try {

        let data = cache.regencies[provinceCode];

        if (!data) {

            data = await getJSON(
                `${API}/regencies/${provinceCode}`
            );

            cache.regencies[provinceCode] = data;
        }

        data.forEach(item => {

            $("#kabupaten").append(`
                <option value="${item.code}">
                    ${escapeHtml(item.name)}
                </option>
            `);

        });

        $("#kabupaten").prop("disabled", false);

    } catch (error) {

        console.error(error);

        $("#kabupaten").html(
            `<option value="">Gagal memuat Kabupaten / Kota</option>`
        );

        alert("Gagal mengambil data Kabupaten/Kota.");

    } finally {

        setLoading("#loadingKabupaten", false);
    }
});


/*
|--------------------------------------------------------------------------
| KABUPATEN -> KECAMATAN
|--------------------------------------------------------------------------
*/

$("#kabupaten").on("change", async function() {

    const regencyCode = $(this).val();

    resetSelect(
        "#kecamatan",
        "-- Pilih Kecamatan --"
    );

    resetSelect(
        "#kelurahan",
        "-- Pilih Kecamatan terlebih dahulu --"
    );

    updateResult();

    if (!regencyCode) {
        return;
    }

    setLoading("#loadingKecamatan", true);

    try {

        let data = cache.districts[regencyCode];

        if (!data) {

            data = await getJSON(
                `${API}/districts/${regencyCode}`
            );

            cache.districts[regencyCode] = data;
        }

        data.forEach(item => {

            $("#kecamatan").append(`
                <option value="${item.code}">
                    ${escapeHtml(item.name)}
                </option>
            `);

        });

        $("#kecamatan").prop("disabled", false);

    } catch (error) {

        console.error(error);

        $("#kecamatan").html(
            `<option value="">Gagal memuat Kecamatan</option>`
        );

        alert("Gagal mengambil data Kecamatan.");

    } finally {

        setLoading("#loadingKecamatan", false);
    }
});


/*
|--------------------------------------------------------------------------
| KECAMATAN -> KELURAHAN
|--------------------------------------------------------------------------
*/

$("#kecamatan").on("change", async function() {

    const districtCode = $(this).val();

    resetSelect(
        "#kelurahan",
        "-- Pilih Kelurahan / Desa --"
    );

    updateResult();

    if (!districtCode) {
        return;
    }

    setLoading("#loadingKelurahan", true);

    try {

        let data = cache.villages[districtCode];

        if (!data) {

            data = await getJSON(
                `${API}/villages/${districtCode}`
            );

            cache.villages[districtCode] = data;
        }

        data.forEach(item => {

            $("#kelurahan").append(`
                <option value="${item.code}">
                    ${escapeHtml(item.name)}
                </option>
            `);

        });

        $("#kelurahan").prop("disabled", false);

    } catch (error) {

        console.error(error);

        $("#kelurahan").html(
            `<option value="">Gagal memuat Kelurahan / Desa</option>`
        );

        alert("Gagal mengambil data Kelurahan/Desa.");

    } finally {

        setLoading("#loadingKelurahan", false);
    }
});


/*
|--------------------------------------------------------------------------
| KELURAHAN CHANGE
|--------------------------------------------------------------------------
*/

$("#kelurahan").on("change", function() {
    updateResult();
});


/*
|--------------------------------------------------------------------------
| HASIL
|--------------------------------------------------------------------------
*/

function updateResult() {

    const provinsi = $("#provinsi option:selected");
    const kabupaten = $("#kabupaten option:selected");
    const kecamatan = $("#kecamatan option:selected");
    const kelurahan = $("#kelurahan option:selected");

    const values = [];

    if ($("#provinsi").val()) {
        values.push(provinsi.text());
    }

    if ($("#kabupaten").val()) {
        values.push(kabupaten.text());
    }

    if ($("#kecamatan").val()) {
        values.push(kecamatan.text());
    }

    if ($("#kelurahan").val()) {
        values.push(kelurahan.text());
    }


    if (values.length === 0) {

        $("#alamatText")
            .text("Belum ada pilihan.")
            .removeClass("text-dark");

        $("#kodeText").html("");

        return;
    }


    $("#alamatText")
        .text(values.join(" → "))
        .addClass("text-dark");


    let kode = "";

    if ($("#provinsi").val()) {
        kode += `Provinsi: <span class="badge text-bg-secondary code-badge">
                    ${$("#provinsi").val()}
                  </span>`;
    }

    if ($("#kabupaten").val()) {
        kode += ` &nbsp; Kabupaten/Kota:
                  <span class="badge text-bg-secondary code-badge">
                    ${$("#kabupaten").val()}
                  </span>`;
    }

    if ($("#kecamatan").val()) {
        kode += ` &nbsp; Kecamatan:
                  <span class="badge text-bg-secondary code-badge">
                    ${$("#kecamatan").val()}
                  </span>`;
    }

    if ($("#kelurahan").val()) {
        kode += ` &nbsp; Kelurahan/Desa:
                  <span class="badge text-bg-secondary code-badge">
                    ${$("#kelurahan").val()}
                  </span>`;
    }

    $("#kodeText").html(kode);
}


/*
|--------------------------------------------------------------------------
| START
|--------------------------------------------------------------------------
*/

$(document).ready(function() {
    loadProvinsi();
});
</script>

</body>
</html>
